<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="blueBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="metalHollow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="108" height="108" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
  
  <!-- Tool Handle -->
  <path d="M48 65 L40 100 Q39 104 44 105 L54 105 Q58 104 56 100 L56 65 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Grip Grooves -->
  <line x1="43" y1="78" x2="53" y2="78" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="42" y1="86" x2="52" y2="86" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="41" y1="94" x2="51" y2="94" stroke="#0ea5e9" stroke-width="2"/>

  <!-- Drill Body (Bright Blue) -->
  <rect x="36" y="42" width="50" height="26" rx="6" fill="url(#blueBody)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="42" y="48" width="22" height="7" rx="2" fill="#000000" stroke="#0ea5e9" stroke-width="1"/>
  <!-- Digital readout: 12.0 N-m -->
  <text x="53" y="54" fill="#38bdf8" font-size="5" font-family="monospace" text-anchor="middle" font-weight="bold">12 N·m</text>
  
  <!-- Hollow Collar / Crescent Socket Head for Coax -->
  <rect x="84" y="47" width="12" height="16" rx="3" fill="url(#metalHollow)" stroke="#475569" stroke-width="1"/>
  <path d="M96 45 C108 45 108 65 96 65 C102 61 102 49 96 45 Z" fill="url(#metalHollow)" stroke="#334155" stroke-width="1.5"/>
  <!-- Hollow cable tunnel cutout -->
  <circle cx="100" cy="55" r="4.5" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="2,2"/>

  <!-- Trigger & LEDs -->
  <polygon points="40,55 35,59 40,63" fill="#e2e8f0"/>
  <circle cx="80" cy="46" r="2" fill="#10b981" filter="url(#neonGlow)"/>
</svg>