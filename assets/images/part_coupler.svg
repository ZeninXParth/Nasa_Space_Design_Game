<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="innerPin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="goldGleam" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="108" height="108" rx="16" fill="#0f172a" stroke="#eab308" stroke-width="2"/>

  <!-- Left Hexagonal Nut Terminal -->
  <polygon points="18,50 26,38 38,38 46,50 38,62 26,62" fill="url(#goldLeaf)" stroke="#a16207" stroke-width="1.5"/>
  <circle cx="32" cy="50" r="6" fill="#1e293b" stroke="#ca8a04"/>
  <circle cx="32" cy="50" r="2.5" fill="url(#innerPin)"/>
  <!-- Left thread collar -->
  <rect x="44" y="44" width="8" height="12" fill="#d97706" stroke="#92400e" stroke-width="1"/>

  <!-- Main RF Waveguide Center Union Block -->
  <rect x="52" y="38" width="22" height="24" rx="3" fill="url(#goldLeaf)" stroke="#78350f" stroke-width="1.5" filter="url(#goldGleam)"/>
  <line x1="56" y1="41" x2="56" y2="59" stroke="#fef08a" stroke-width="1.5"/>
  <!-- Spaceflight Spec Stamp -->
  <text x="63" y="52" fill="#78350f" font-size="4" font-family="monospace" text-anchor="middle" font-weight="bold">SMA-12G</text>

  <!-- Right thread collar -->
  <rect x="74" y="44" width="8" height="12" fill="#d97706" stroke="#92400e" stroke-width="1"/>

  <!-- Right Hexagonal Nut Terminal -->
  <polygon points="80,50 88,38 100,38 108,50 100,62 88,62" fill="url(#goldLeaf)" stroke="#a16207" stroke-width="1.5"/>
  <circle cx="94" cy="50" r="6" fill="#1e293b" stroke="#ca8a04"/>
  <circle cx="94" cy="50" r="2.5" fill="url(#innerPin)"/>

  <!-- Grounding Flange Base with Fastener Holes -->
  <rect x="36" y="68" width="54" height="14" rx="2" fill="url(#goldLeaf)" stroke="#78350f" stroke-width="1.5"/>
  <circle cx="44" cy="75" r="3" fill="#0f172a" stroke="#ca8a04"/>
  <circle cx="82" cy="75" r="3" fill="#0f172a" stroke="#ca8a04"/>
  <line x1="48" y1="75" x2="78" y2="75" stroke="#a16207" stroke-width="1" stroke-dasharray="2,2"/>
</svg>