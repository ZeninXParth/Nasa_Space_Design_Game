<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="60%" stop-color="#03050a"/>
      <stop offset="100%" stop-color="#010204"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffef0" stop-opacity="1"/>
      <stop offset="20%" stop-color="#fed7aa" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="armGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1000" height="1000" fill="url(#spaceBg)"/>

  <!-- Background Faint Galaxies -->
  <g opacity="0.55">
    <ellipse cx="180" cy="220" rx="24" ry="8" fill="#fdba74" transform="rotate(35, 180, 220)" filter="url(#starGlow)"/>
    <ellipse cx="840" cy="310" rx="18" ry="6" fill="#93c5fd" transform="rotate(-40, 840, 310)"/>
    <ellipse cx="210" cy="820" rx="14" ry="10" fill="#f472b6" transform="rotate(15, 210, 820)"/>
    <ellipse cx="780" cy="780" rx="22" ry="7" fill="#fef08a" transform="rotate(60, 780, 780)"/>
    <circle cx="140" cy="520" r="2.5" fill="#67e8f9"/>
    <circle cx="880" cy="640" r="3.0" fill="#fed7aa"/>
    <circle cx="320" cy="140" r="2.0" fill="#e0e7ff"/>
    <circle cx="670" cy="110" r="2.5" fill="#fef08a"/>
  </g>

  <!-- M100 Spiral Arms and Dust Lanes Structure -->
  <g transform="translate(500, 500) rotate(-22)">
    <!-- Outer H II diffuse halo -->
    <ellipse cx="0" cy="0" rx="380" ry="310" fill="url(#armGlow)" opacity="0.45"/>

    <!-- Main Spiral Arm 1 -->
    <path d="M 0,0 C 70,30 140,90 180,180 C 210,240 180,310 120,350 C 40,400 -90,380 -190,320 C -280,260 -340,150 -320,50 C -300,-40 -210,-120 -120,-160" 
          fill="none" stroke="#93c5fd" stroke-width="48" stroke-linecap="round" opacity="0.4" filter="url(#starGlow)"/>
    <path d="M 0,0 C 70,30 140,90 180,180 C 210,240 180,310 120,350 C 40,400 -90,380 -190,320 C -280,260 -340,150 -320,50 C -300,-40 -210,-120 -120,-160" 
          fill="none" stroke="#e0f2fe" stroke-width="22" stroke-linecap="round" opacity="0.75"/>
    <!-- Dust Lane Along Arm 1 -->
    <path d="M 20,10 C 85,40 145,100 175,175 C 200,230 170,290 115,330" 
          fill="none" stroke="#1e1b4b" stroke-width="12" opacity="0.6"/>

    <!-- Main Spiral Arm 2 -->
    <path d="M 0,0 C -70,-30 -140,-90 -180,-180 C -210,-240 -180,-310 -120,-350 C -40,-400 90,-380 190,-320 C 280,-260 340,-150 320,-50 C 300,40 210,120 120,160" 
          fill="none" stroke="#60a5fa" stroke-width="48" stroke-linecap="round" opacity="0.4" filter="url(#starGlow)"/>
    <path d="M 0,0 C -70,-30 -140,-90 -180,-180 C -210,-240 -180,-310 -120,-350 C -40,-400 90,-380 190,-320 C 280,-260 340,-150 320,-50 C 300,40 210,120 120,160" 
          fill="none" stroke="#bae6fd" stroke-width="22" stroke-linecap="round" opacity="0.75"/>
    <!-- Dust Lane Along Arm 2 -->
    <path d="M -20,-10 C -85,-40 -145,-100 -175,-175 C -200,-230 -170,-290 -115,-330" 
          fill="none" stroke="#172554" stroke-width="12" opacity="0.6"/>

    <!-- Secondary Star-Burst Armlets and H II emission knots -->
    <g fill="#f43f5e" opacity="0.75" filter="url(#starGlow)">
      <circle cx="140" cy="210" r="8"/>
      <circle cx="170" cy="270" r="6"/>
      <circle cx="70" cy="340" r="7"/>
      <circle cx="-150" cy="-210" r="8"/>
      <circle cx="-180" cy="-260" r="6"/>
      <circle cx="-80" cy="-330" r="7"/>
      <circle cx="-240" cy="120" r="7"/>
      <circle cx="240" cy="-110" r="7"/>
    </g>

    <!-- Blue Stellar Clusters along arms -->
    <g fill="#e0f2fe" opacity="0.9" filter="url(#starGlow)">
      <circle cx="100" cy="140" r="4"/>
      <circle cx="130" cy="190" r="5"/>
      <circle cx="185" cy="250" r="4.5"/>
      <circle cx="150" cy="300" r="4"/>
      <circle cx="-110" cy="-140" r="4"/>
      <circle cx="-140" cy="-190" r="5"/>
      <circle cx="-185" cy="-250" r="4.5"/>
      <circle cx="-160" cy="-300" r="4"/>
    </g>

    <!-- Brilliant Galaxy Core and Nuclear Ring -->
    <ellipse cx="0" cy="0" rx="160" ry="135" fill="url(#coreGlow)"/>
    <ellipse cx="0" cy="0" rx="65" ry="52" fill="#fef08a" opacity="0.85" filter="url(#starGlow)"/>
    <ellipse cx="0" cy="0" rx="24" ry="20" fill="#ffffff" filter="url(#starGlow)"/>
  </g>

  <!-- Foreground Calibration Guide Stars with 4-point secondary spider diffraction spikes -->
  <g transform="translate(280, 240)">
    <line x1="-40" y1="-40" x2="40" y2="40" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    <line x1="-40" y1="40" x2="40" y2="-40" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#starGlow)"/>
  </g>
  <g transform="translate(740, 680)">
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#f59e0b" stroke-width="1.8" opacity="0.85"/>
    <line x1="-50" y1="50" x2="50" y2="-50" stroke="#f59e0b" stroke-width="1.8" opacity="0.85"/>
    <circle cx="0" cy="0" r="7" fill="#fffbeb" filter="url(#starGlow)"/>
  </g>
  <g transform="translate(820, 180)">
    <line x1="-30" y1="-30" x2="30" y2="30" stroke="#e0e7ff" stroke-width="1.2" opacity="0.75"/>
    <line x1="-30" y1="30" x2="30" y2="-30" stroke="#e0e7ff" stroke-width="1.2" opacity="0.75"/>
    <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
  </g>

  <!-- NASA WFPC2 Iconic L-Shaped Chevron Detector Footprint and Telemetry Reticle -->
  <g stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5" fill="none">
    <!-- PC1 Quadrant (High Resolution Planetary Camera) -->
    <rect x="500" y="120" width="380" height="380" stroke-dasharray="6 4"/>
    <text x="515" y="145" font-family="monospace" font-size="14" fill="#38bdf8" letter-spacing="1">DET: PC1 [F/28.3]</text>

    <!-- WF2 Quadrant (Wide Field Camera 2) -->
    <rect x="120" y="120" width="380" height="380" stroke-dasharray="6 4"/>
    <text x="135" y="145" font-family="monospace" font-size="14" fill="#38bdf8" letter-spacing="1">DET: WF2 [F/12.9]</text>

    <!-- WF3 Quadrant (Wide Field Camera 3) -->
    <rect x="120" y="500" width="380" height="380" stroke-dasharray="6 4"/>
    <text x="135" y="525" font-family="monospace" font-size="14" fill="#38bdf8" letter-spacing="1">DET: WF3 [F/12.9]</text>

    <!-- WF4 Quadrant (Wide Field Camera 4) -->
    <rect x="500" y="500" width="380" height="380" stroke-dasharray="6 4"/>
    <text x="515" y="525" font-family="monospace" font-size="14" fill="#38bdf8" letter-spacing="1">DET: WF4 [F/12.9]</text>

    <!-- Center Optical Crosshair -->
    <circle cx="500" cy="500" r="40" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <circle cx="500" cy="500" r="12" stroke="#10b981" stroke-width="1.2" opacity="0.8"/>
    <line x1="500" y1="440" x2="500" y2="560" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <line x1="440" y1="500" x2="560" y2="500" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Technical Telemetry Stamp -->
  <g font-family="monospace" font-size="13" fill="rgba(224, 242, 254, 0.75)">
    <text x="35" y="50">TARGET: M100 (NGC 4321) // VIRGO CLUSTER</text>
    <text x="35" y="72">COORDINATES: RA 12h 22m 54.9s | DEC +15° 49′ 21″</text>
    <text x="35" y="94">OPTICAL APERTURE: 2.4m RITCHEY-CHRETIEN OTA</text>
    <text x="35" y="945">INSTRUMENT: WFPC2 / COSTAR OPTICAL AXIS</text>
    <text x="35" y="968">BANDPASS: F555W (V) + F814W (I) COMPOSITE</text>
    <text x="680" y="968" fill="#10b981" font-weight="bold">DIFFRACTION LIMIT: 0.052 ARCSEC</text>
  </g>
</svg>