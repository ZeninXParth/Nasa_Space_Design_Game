<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">
  <defs>
    <linearGradient id="fgsAluminum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="fgsLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <!-- Main Enclosure -->
  <rect x="14" y="16" width="52" height="88" rx="4" fill="url(#fgsAluminum)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="18" y="20" width="44" height="2" fill="#cbd5e1" opacity="0.6"/>

  <!-- Optical Collimator Window / Bezel -->
  <circle cx="40" cy="38" r="14" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="40" cy="38" r="11" fill="url(#fgsLens)"/>
  <ellipse cx="37" cy="35" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>

  <!-- Diagnostic Terminal Block -->
  <rect x="20" y="58" width="40" height="28" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  
  <!-- Node A (Red / Positive) -->
  <circle cx="30" cy="72" r="5" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="30" cy="72" r="2" fill="#fca5a5"/>
  <text x="30" y="64" font-family="'Tektur', monospace" font-size="6" fill="#ef4444" text-anchor="middle" font-weight="700">NODE A</text>

  <!-- Node B (Black / Negative) -->
  <circle cx="50" cy="72" r="5" fill="#18181b" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="50" cy="72" r="2" fill="#ffffff"/>
  <text x="50" y="64" font-family="'Tektur', monospace" font-size="6" fill="#94a3b8" text-anchor="middle" font-weight="700">NODE B</text>

  <!-- Potentiometer Adjustment Screw -->
  <circle cx="40" cy="94" r="5" fill="#b45309" stroke="#fbbf24" stroke-width="1"/>
  <line x1="37" y1="94" x2="43" y2="94" stroke="#451a03" stroke-width="1.5"/>
  <text x="40" y="106" font-family="'Tektur', monospace" font-size="5" fill="#fbbf24" text-anchor="middle" font-weight="700">POT TUNE</text>
</svg>
