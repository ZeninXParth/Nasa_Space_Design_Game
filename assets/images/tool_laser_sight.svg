<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="silverBarrel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="rubyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4f"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <filter id="rubyBeam" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="108" height="108" rx="16" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>

  <!-- Rail Clip Bracket -->
  <path d="M25 68 L25 86 L37 86 L37 78 L47 78 L47 86 L59 86 L59 68 Z" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="42" cy="74" r="3" fill="#cbd5e1"/>
  <!-- Thumbscrew knob -->
  <rect x="36" y="86" width="12" height="6" rx="2" fill="#94a3b8"/>

  <!-- Cylindrical Anodized Silver Laser Housing -->
  <rect x="20" y="44" width="68" height="24" rx="4" fill="url(#silverBarrel)" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Knurled focus ring -->
  <rect x="64" y="42" width="12" height="28" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
  <line x1="67" y1="43" x2="67" y2="69" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="70" y1="43" x2="70" y2="69" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="73" y1="43" x2="73" y2="69" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Front Bezel -->
  <rect x="88" y="46" width="8" height="20" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  
  <!-- Glowing Ruby Optical Lens -->
  <circle cx="96" cy="56" r="6" fill="url(#rubyGlow)" filter="url(#rubyBeam)"/>
  <circle cx="96" cy="56" r="2.5" fill="#ffffff"/>

  <!-- Emitted Laser Beam Line -->
  <line x1="102" y1="56" x2="114" y2="56" stroke="#ff4d4f" stroke-width="2" filter="url(#rubyBeam)"/>

  <!-- Crosshair Reticle watermark -->
  <circle cx="60" cy="56" r="32" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
</svg>