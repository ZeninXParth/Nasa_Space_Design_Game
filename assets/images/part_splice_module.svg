<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="clearSleeve" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="steelRod" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="arcFlash" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="108" height="108" rx="16" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>

  <!-- Optical Fiber Cables Entering Ends (Orange Flight Wrap) -->
  <rect x="10" y="55" width="22" height="10" rx="3" fill="#f97316" stroke="#ea580c" stroke-width="1"/>
  <rect x="88" y="55" width="22" height="10" rx="3" fill="#f97316" stroke="#ea580c" stroke-width="1"/>
  <!-- Exposed microscopic glass strands -->
  <line x1="28" y1="60" x2="92" y2="60" stroke="#38bdf8" stroke-width="2"/>

  <!-- Stainless Steel Strength Member Rod Inside -->
  <rect x="24" y="52" width="72" height="4" rx="2" fill="url(#steelRod)" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Clear Heat-Shrinkable Polyolefin Splice Tube -->
  <rect x="22" y="46" width="76" height="28" rx="10" fill="url(#clearSleeve)" stroke="#38bdf8" stroke-width="1.5"/>
  <ellipse cx="26" cy="60" rx="3" ry="10" fill="#7dd3fc" stroke="#38bdf8" stroke-width="1"/>
  <ellipse cx="94" cy="60" rx="3" ry="10" fill="#7dd3fc" stroke="#38bdf8" stroke-width="1"/>

  <!-- High-Precision Fusion Arc Point at Core Center -->
  <circle cx="60" cy="60" r="4" fill="#ffffff" filter="url(#arcFlash)"/>
  <circle cx="60" cy="60" r="1.5" fill="#38bdf8"/>
  <line x1="60" y1="48" x2="60" y2="72" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- EVA Internal Melt Liner indication -->
  <line x1="32" y1="49" x2="88" y2="49" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Splice Tray Alignment Carrier -->
  <rect x="30" y="86" width="60" height="16" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Retention V-Groove clips -->
  <polygon points="42,86 46,92 50,86" fill="#38bdf8"/>
  <polygon points="70,86 74,92 78,86" fill="#38bdf8"/>
  <text x="60" y="99" fill="#06b6d4" font-size="5" font-family="monospace" text-anchor="middle" font-weight="bold">SI-C&amp;DH TRAY</text>
</svg>