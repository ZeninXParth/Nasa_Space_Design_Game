  <!-- Flexible Wires -->
  <path d="M26 115 C24 95, 20 85, 28 65" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <path d="M54 115 C56 95, 60 85, 52 65" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Red Probe Handle -->
  <rect x="23" y="24" width="10" height="42" rx="3" fill="url(#probeRed)"/>
  <rect x="21" y="32" width="14" height="4" rx="1.5" fill="#991b1b"/>
  <rect x="21" y="44" width="14" height="4" rx="1.5" fill="#991b1b"/>
  <polygon points="24,24 32,24 30,12 26,12" fill="#b91c1c"/>
  <rect x="27" y="3" width="2" height="10" fill="url(#metalNeedle)"/>
