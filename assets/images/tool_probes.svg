  <!-- Black Probe Handle -->
  <rect x="47" y="24" width="10" height="42" rx="3" fill="url(#probeBlack)"/>
  <rect x="45" y="32" width="14" height="4" rx="1.5" fill="#1e293b"/>
  <rect x="45" y="44" width="14" height="4" rx="1.5" fill="#1e293b"/>
  <polygon points="48,24 56,24 54,12 50,12" fill="#0f172a"/>
