<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">
  <defs>
    <linearGradient id="pcbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="goldPins" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Main PCB Substrate -->
  <rect x="12" y="16" width="56" height="88" rx="4" fill="url(#pcbGreen)" stroke="#10b981" stroke-width="1.2"/>
  
  <!-- Corner Mounting Holes -->
  <circle cx="18" cy="22" r="2.5" fill="#0f172a" stroke="#d4d4d8" stroke-width="0.8"/>
  <circle cx="62" cy="22" r="2.5" fill="#0f172a" stroke="#d4d4d8" stroke-width="0.8"/>
  <circle cx="18" cy="98" r="2.5" fill="#0f172a" stroke="#d4d4d8" stroke-width="0.8"/>
  <circle cx="62" cy="98" r="2.5" fill="#0f172a" stroke="#d4d4d8" stroke-width="0.8"/>

  <!-- Copper/Gold Traces -->
  <path d="M22 36 H38 V48 H52" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.7"/>
  <path d="M22 42 H30 V60 H40" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.7"/>
  <path d="M58 36 H46 V50" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.7"/>
  <path d="M26 80 H40 V68 H54" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.7"/>

  <!-- Main QFP IC Chip (DF-224 Processor) -->
  <rect x="28" y="46" width="24" height="24" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="33" cy="51" r="1.2" fill="#10b981"/>
  <rect x="34" y="55" width="12" height="6" fill="#1e293b"/>
  <!-- IC Pins -->
  <line x1="28" y1="50" x2="25" y2="50" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="28" y1="54" x2="25" y2="54" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="28" y1="58" x2="25" y2="58" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="28" y1="62" x2="25" y2="62" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="52" y1="50" x2="55" y2="50" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="52" y1="54" x2="55" y2="54" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="52" y1="58" x2="55" y2="58" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="52" y1="62" x2="55" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <!-- SMD Capacitors / Resistors -->
  <rect x="20" y="28" width="6" height="3" fill="#3b82f6" rx="0.5"/>
  <rect x="54" y="28" width="6" height="3" fill="#ef4444" rx="0.5"/>
  <rect x="20" y="72" width="6" height="3" fill="#d97706" rx="0.5"/>
  <rect x="54" y="72" width="6" height="3" fill="#3b82f6" rx="0.5"/>

  <!-- Gold Edge Connector Fingers -->
  <rect x="20" y="104" width="4" height="10" fill="url(#goldPins)"/>
  <rect x="26" y="104" width="4" height="10" fill="url(#goldPins)"/>
  <rect x="32" y="104" width="4" height="10" fill="url(#goldPins)"/>
  <rect x="38" y="104" width="4" height="10" fill="url(#goldPins)"/>
  <rect x="44" y="104" width="4" height="10" fill="url(#goldPins)"/>
  <rect x="50" y="104" width="4" height="10" fill="url(#goldPins)"/>
  <rect x="56" y="104" width="4" height="10" fill="url(#goldPins)"/>
</svg>
