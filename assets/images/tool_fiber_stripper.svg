<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="neonYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cutterSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="108" height="108" rx="16" fill="#0f172a" stroke="#eab308" stroke-width="2"/>

  <!-- Neon-Yellow Handles -->
  <path d="M42 55 C34 70 26 88 28 102 C29 106 35 106 37 102 C39 88 48 70 52 58 Z" fill="url(#neonYellow)" stroke="#a16207" stroke-width="1.5"/>
  <path d="M78 55 C86 70 94 88 92 102 C91 106 85 106 83 102 C81 88 72 70 68 58 Z" fill="url(#neonYellow)" stroke="#a16207" stroke-width="1.5"/>
  <!-- Handle Gripping Ribs -->
  <line x1="30" y1="84" x2="38" y2="82" stroke="#713f12" stroke-width="2"/>
  <line x1="28" y1="92" x2="36" y2="90" stroke="#713f12" stroke-width="2"/>
  <line x1="90" y1="84" x2="82" y2="82" stroke="#713f12" stroke-width="2"/>
  <line x1="92" y1="92" x2="84" y2="90" stroke="#713f12" stroke-width="2"/>

  <!-- Plier Jaws with Precision Micro-Notches -->
  <path d="M50 50 L48 28 C48 24 54 22 56 24 L58 45 Z" fill="url(#cutterSteel)" stroke="#475569" stroke-width="1"/>
  <path d="M70 50 L72 28 C72 24 66 22 64 24 L62 45 Z" fill="url(#cutterSteel)" stroke="#475569" stroke-width="1"/>
  <!-- Calibrated V-Notches for 250µm / 125µm fiber -->
  <circle cx="59.5" cy="30" r="1.5" fill="#0f172a"/>
  <circle cx="60.5" cy="36" r="2" fill="#0f172a"/>

  <!-- Center Pivot Hinge -->
  <circle cx="60" cy="52" r="7" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="60" cy="52" r="3" fill="#0f172a"/>

  <!-- Built-in Magnifying Loupe Arm extending from top hinge -->
  <path d="M60 45 L60 22 L72 16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="78" cy="14" r="8" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="78" cy="14" r="5" fill="#bae6fd" fill-opacity="0.5"/>
  <line x1="75" y1="12" x2="81" y2="16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
</svg>