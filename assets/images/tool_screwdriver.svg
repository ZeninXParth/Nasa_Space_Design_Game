<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">
  <defs>
    <linearGradient id="ceramicHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="nonConductiveShaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ceramicBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- Handle Grip -->
  <rect x="33" y="60" width="14" height="48" rx="4" fill="url(#ceramicHandle)"/>
  <!-- Grip Ribs -->
  <line x1="33" y1="72" x2="47" y2="72" stroke="#0284c7" stroke-width="2"/>
  <line x1="33" y1="84" x2="47" y2="84" stroke="#0284c7" stroke-width="2"/>
  <line x1="33" y1="96" x2="47" y2="96" stroke="#0284c7" stroke-width="2"/>
  <circle cx="40" cy="112" r="3" fill="#0369a1"/>
  
  <!-- Collar -->
  <rect x="36" y="52" width="8" height="8" rx="1" fill="#0f172a"/>
  
  <!-- Non-Conductive Shaft (Amber Ceramic / Polymer) -->
  <rect x="38" y="14" width="4" height="38" fill="url(#nonConductiveShaft)"/>
  <line x1="39.5" y1="14" x2="39.5" y2="52" stroke="#fef08a" stroke-width="0.8"/>
  
  <!-- Precision Flathead Ceramic Tip -->
  <polygon points="37,14 43,14 42,4 38,4" fill="url(#ceramicBlade)"/>
  <rect x="38" y="2" width="4" height="2" fill="#e2e8f0"/>
</svg>
